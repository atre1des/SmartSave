name: SmartSave iOS Simulator

on:
  workflow_dispatch:
  # Bootstrap the first run while this workflow lives off the default branch.
  push:
    branches: [stage-11/ios-cloud-build]

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared tests run on Linux, matching the existing regression CI host.
  # macOS is reserved for the native simulator build.
  flutter-checks:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Get Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Test Flutter code
        run: flutter test --no-pub --concurrency=1

  simulator:
    needs: flutter-checks
    name: Build and package unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # This client endpoint is compiled into the app. Supply only a public HTTPS URL.
      SMARTSAVE_BACKEND_URL: ${{ vars.SMARTSAVE_BACKEND_URL || 'https://smartsave-sl61.onrender.com' }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Validate macOS toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version
          flutter doctor -v

      - name: Get Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Resolve native dependencies
        # Flutter prepares Generated.xcconfig and runs CocoaPods before returning.
        run: flutter build ios --simulator --debug --no-codesign --config-only --no-pub

      - name: Build unsigned iOS Simulator app
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["SMARTSAVE_BACKEND_URL"])
          if (
              url.scheme != "https" or not url.hostname
              or url.username is not None or url.password is not None
              or url.query or url.fragment
              or url.path not in ("", "/")
          ):
              raise SystemExit("SMARTSAVE_BACKEND_URL must be a public HTTPS origin without credentials or query parameters.")
          PY
          flutter build ios --simulator --debug --no-codesign --no-pub \
            --dart-define="SMARTSAVE_BACKEND_URL=$SMARTSAVE_BACKEND_URL"

      - name: Verify and package Runner.app
        run: |
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app"
          plist="$app/Info.plist"
          binary="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          test -f "$binary"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$plist")" = iPhoneSimulator
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$app/GoogleService-Info.plist")" \
            = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          lipo -archs "$binary"
          ditto -c -k --keepParent "$app" SmartSave-iOS-Simulator.app.zip
          unzip -tq SmartSave-iOS-Simulator.app.zip

      - name: Upload simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SmartSave-iOS-Simulator
          path: SmartSave-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
